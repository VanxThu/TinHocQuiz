<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: An toàn trong không gian mạng</title>
<style>
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(-45deg, #160b1d, #24102e, #10091a, #29112f);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
}
@keyframes gradientBG {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}
#quiz-container {
  padding: 40px;
  border-radius: 20px;
  max-width: 900px;
  width: 95%;
  background: rgba(0, 0, 0, 0.55);
  text-align: center;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
  position: relative;
  z-index: 2;
}
h1 {
  font-size: 42px;
  margin: 0 0 50px 0;
}
#start-btn {
  padding: 18px 35px;
  font-size: 26px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: white;
  color: black;
  transition: transform 0.2s ease, background 0.2s ease;
}
#start-btn:hover {
  transform: scale(1.06);
  background: #eeeeee;
}
#quiz {
  display: none;
}
#question {
  font-size: 28px;
  font-weight: bold;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 25px;
  line-height: 1.4;
}
#answers {
  width: 100%;
}
.answer {
  display: block;
  width: 100%;
  margin: 15px 0;
  padding: 20px;
  background: #f0f0f0;
  border-radius: 10px;
  cursor: pointer;
  color: #000;
  font-size: 24px;
  transition: transform 0.08s ease-out, background 0.08s ease-out, box-shadow 0.08s ease-out;
  transform: scale(1);
  transform-origin: center center;
  will-change: transform;
  position: relative;
  z-index: 1;
}
.answer:hover {
  background: #ddd;
  transform: scale(1.04);
  box-shadow: 0 4px 18px rgba(255,255,255,0.18);
  z-index: 5;
}
.answer.hover-active {
  background: #ddd;
  transform: scale(1.04);
  box-shadow: 0 4px 18px rgba(255,255,255,0.18);
  z-index: 5;
}
.feedback {
  font-size: 26px;
  font-weight: bold;
  min-height: 35px;
  margin-top: 20px;
}
.credit {
  margin-top: 35px;
  font-size: 18px;
  font-style: italic;
  color: #aaa;
}
#fireworks {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9998;
}
#thanks-container {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(-45deg, #160b1d, #24102e, #10091a, #29112f);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
  z-index: 9999;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.thanks-title {
  font-size: 100px;
  font-weight: bold;
  letter-spacing: 8px;
  margin-bottom: 35px;
  text-shadow: 0 0 15px rgba(255,255,255,0.6), 0 0 35px rgba(255,255,255,0.3);
  animation: thanksTitle 1.2s ease-out;
}
.thanks-text {
  font-size: 32px;
  font-weight: bold;
  margin: 10px 0;
  animation: thanksText 1.5s ease-out;
}
@keyframes thanksTitle {
  from {
    opacity: 0;
    transform: scale(0.5);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
@keyframes thanksText {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (max-width: 700px) {
  h1 {
    font-size: 30px;
  }
  #question {
    font-size: 22px;
  }
  .answer {
    font-size: 18px;
    padding: 15px;
  }
  .thanks-title {
    font-size: 65px;
  }
  .thanks-text {
    font-size: 24px;
  }
}
</style>
</head>
<body>
<div id="quiz-container">
<h1>Quiz: An toàn trong không gian mạng</h1>
<button id="start-btn">🚀 Bắt đầu Quiz</button>
<div id="quiz">
<p id="question"></p>
<div id="answers"></div>
<p id="feedback" class="feedback"></p>
</div>
<div class="credit">✨ Cre by Haii Phong ✨</div>
</div>
<canvas id="fireworks"></canvas>
<div id="thanks-container">
<div class="thanks-title">THANKS</div>
<div class="thanks-text">Cám ơn các bạn đã trả lời câu hỏi</div>
<div class="thanks-text">Tạm biệt và hẹn gặp lại</div>
</div>
<script>
const questions = [
{
question: "Câu 1: Vì sao việc sử dụng Wi-Fi công cộng dễ dẫn đến nguy cơ bị lộ thông tin cá nhân?",
answers: [
"A. Do tốc độ đường truyền Wi-Fi không ổn định",
"B. Do hầu hết trạm Wi-Fi không mã hóa dữ liệu",
"C. Do thiết bị tự động ngắt kết nối liên tục",
"D. Do giới hạn dung lượng truy cập hàng ngày"
],
correct: "B"
},
{
question: "Câu 2: Kẻ xấu thường thực hiện hành vi lừa đảo nào sau đây trên các trang mạng xã hội?",
answers: [
"A. Phát tán phần mềm tiện ích miễn phí",
"B. Tự động cập nhật hệ điều hành máy tính",
"C. Lập trang giả mạo nạn nhân để vay mượn tiền",
"D. Gửi các khảo sát trực tuyến không thu phí"
],
correct: "C"
},
{
question: "Câu 3: Việc dành quá nhiều thời gian chơi game trực tuyến liên tục có thể gây ra hậu quả gì?",
answers: [
"A. Làm mất tài khoản mạng xã hội cá nhân",
"B. Dẫn đến nguy cơ đột quỵ ngay tại máy tính",
"C. Làm lộ thông tin tài khoản ngân hàng",
"D. Làm tê liệt toàn bộ hệ thống máy tính"
],
correct: "B"
},
{
question: "Câu 4: Khi bị bắt nạt nghiêm trọng trên mạng, cách xử lý nào sau đây là phù hợp nhất?",
answers: [
"A. Im lặng tự giải quyết để tránh rắc rối",
"B. Tranh luận trực tiếp với kẻ bắt nạt",
"C. Báo công an và cung cấp các bằng chứng",
"D. Xóa bỏ hoàn toàn các tài khoản cá nhân"
],
correct: "C"
},
{
question: "Câu 5: Khái niệm \"Phần mềm độc hại\" (Malware) dùng để chỉ loại chương trình nào?",
answers: [
"A. Phần mềm làm giảm tốc độ mạng Internet",
"B. Chương trình gây tiêu tốn nhiều bộ nhớ",
"C. Phần mềm viết ra với mục đích gây hại",
"D. Mã nguồn mở chưa qua kiểm duyệt mạng"
],
correct: "C"
},
{
question: "Câu 6: Sâu máy tính WannaCry (2017) đã thực hiện hành vi gây thiệt hại nào sau đây?",
answers: [
"A. Đánh cắp mật khẩu đăng nhập của nạn nhân",
"B. Mã hóa dữ liệu đĩa cứng để đòi tiền chuộc",
"C. Chiếm đoạt quyền sử dụng mạng xã hội",
"D. Xóa bỏ hoàn toàn hệ điều hành máy tính"
],
correct: "B"
},
{
question: "Câu 7: Loại phần mềm độc hại nào ngầm ghi lại hoạt động của bàn phím và chuột?",
answers: [
"A. Chương trình Backdoor",
"B. Phần mềm Keylogger",
"C. Chương trình Rootkit",
"D. Chương trình Trojan"
],
correct: "B"
},
{
question: "Câu 8: Hành động nào sau đây giúp phòng ngừa hiệu quả sự xâm nhập của phần mềm độc hại?",
answers: [
"A. Mở mọi liên kết từ thư điện tử của bạn bè",
"B. Tải các chương trình bẻ khóa trên mạng",
"C. Thận trọng khi sao chép tệp từ thiết bị ngoài",
"D. Tắt bỏ hoàn toàn hệ thống tường lửa máy tính"
],
correct: "C"
},
{
question: "Câu 9: Sự khác biệt cơ bản về đặc điểm giữa Virus và Worm (sâu máy tính) là gì?",
answers: [
"A. Virus là đoạn mã, Worm là phần mềm hoàn chỉnh",
"B. Virus lây qua mạng, Worm lây qua đĩa cứng",
"C. Virus đánh cắp tin, Worm làm hỏng phần cứng",
"D. Virus không xóa tin, Worm luôn mã hóa dữ liệu"
],
correct: "A"
},
{
question: "Câu 10: Hình thức tấn công mạng nào làm quá tải và gây tê liệt máy chủ định trước?",
answers: [
"A. Mã hóa toàn bộ dữ liệu",
"B. Đánh cắp tài khoản cá nhân",
"C. Từ chối dịch vụ (DOS)",
"D. Cài đặt cửa sau Backdoor"
],
correct: "C"
}
];
let current = 0;
const startBtn = document.getElementById("start-btn");
const quiz = document.getElementById("quiz");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const feedbackEl = document.getElementById("feedback");
const quizContainer = document.getElementById("quiz-container");
const thanksContainer = document.getElementById("thanks-container");
startBtn.addEventListener("click", async () => {
  startBtn.style.display = "none";
  quiz.style.display = "block";
  loadQuestion();
  try {
    if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    }
  } catch (error) {
  }
});
function loadQuestion() {
  feedbackEl.textContent = "";
  const q = questions[current];
  questionEl.textContent = q.question;
  answersEl.innerHTML = "";
  q.answers.forEach(answer => {
    const div = document.createElement("div");
    div.className = "answer";
    div.textContent = answer;
    div.addEventListener("click", () => checkAnswer(answer));
    div.addEventListener("pointerenter", () => {
      div.classList.add("hover-active");
    });
    div.addEventListener("pointerleave", () => {
      div.classList.remove("hover-active");
    });
    answersEl.appendChild(div);
  });
}
function checkAnswer(answer) {
  const q = questions[current];
  if (answer.startsWith(q.correct + ".")) {
    feedbackEl.textContent = "✓ Chính xác!";
    feedbackEl.style.color = "#00ff66";
    createFireworks();
    setTimeout(() => {
      current++;
      if (current < questions.length) {
        loadQuestion();
      } else {
        quizContainer.style.display = "none";
        thanksContainer.style.display = "flex";
      }
    }, 900);
  } else {
    feedbackEl.textContent = "✗ Sai rồi!";
    feedbackEl.style.color = "#ff4444";
  }
}
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);
function createFireworks() {
  for (let i = 0; i < 100; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12,
      life: 80
    });
  }
}
function animateFireworks() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach((p, index) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life--;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
    if (p.life <= 0) {
      particles.splice(index, 1);
    }
  });
  requestAnimationFrame(animateFireworks);
}
animateFireworks();
</script>
</body>
</html>
